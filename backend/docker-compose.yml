services:
  postgres:
    image: postgres:16
    container_name: buddychecks_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buddychecks_dev
    ports:
      - "5432:5432"
    volumes:
      - buddychecks_pgdata:/var/lib/postgresql/data

volumes:
  buddychecks_pgdata:
